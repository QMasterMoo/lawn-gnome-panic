syntax = "proto3";

package gnome.inventory.v1;

import "gnome/common/v1/common.proto";

// The catalog: every cosmetic item that exists, shared by all games.
//
// Items are cosmetic. An item never changes damage, speed or score; it changes how one of a game's
// own mechanics looks. Traits say which mechanics an item can dress up, and each game decides what
// that means for it. A golf club with uses [MELEE] and handling [TWO_HANDED, BLUNT] is a skin for
// Gnome Front's two-handed melee swing; the swing's stats stay Gnome Front's.

// One item definition. The catalog's source of truth is a data file in the repo (code over
// clicking); the service loads it at deploy and serves it read-only.
message ItemDef {
  // Stable slug, "<family>.<kind>.<name>", e.g. "golf.club.oak-driver". Never reused or renamed.
  string item_id = 1;
  string display_name = 2;
  string description = 3;
  // Where the item goes on a gnome (or which game object it skins).
  Slot slot = 4;

  // Traits. Each group is its own type; games query them with TraitQuery.
  // What the item broadly is. Exactly one.
  ItemKind kind = 5;
  // The specific object, for lookups like "any golf ball". Unset for one-off items (a hat).
  ItemFamily family = 6;
  // Which kinds of game mechanic the item can skin.
  repeated ItemUse uses = 7;
  // Physical traits a game needs to pick an animation or check a combination.
  repeated ItemHandling handling = 8;
  // Sets and collections.
  repeated ItemTheme themes = 9;

  Rarity rarity = 10;
  // The game the item comes from. GAME_UNSPECIFIED for platform-wide items (starters, events).
  gnome.common.v1.Game origin_game = 11;
  // How the item can be unlocked.
  ClaimPolicy claim_policy = 12;
  // For CLAIM_POLICY_CLIENT_CLAIM: the games whose clients may claim it. A Gnome Front client
  // cannot claim a golf item.
  repeated gnome.common.v1.Game claimable_from = 13;
  // Fallback tint, 0xRRGGBB. A game with no art for this item draws a generic shape for its traits
  // (a generic two-handed blunt weapon, a generic ball) in these colours.
  uint32 primary_rgb = 14;
  uint32 secondary_rgb = 15;
  // Per-game art. A game with no entry uses the fallback above.
  repeated ItemArt art = 16;
  // Hidden from catalog listings until the caller owns it (secret unlocks like Gnome Golf's 350Z).
  bool secret = 17;
  // No longer unlockable. Players who own it keep it.
  bool retired = 18;
}

// Art for one game. The key indexes that game's own bundled asset table; the platform stores no
// files. Games are static builds, so new art ships with the game, not with the catalog.
message ItemArt {
  gnome.common.v1.Game game = 1;
  string asset_key = 2;
}

// Where an item is worn or what game object it replaces. One slot per item.
enum Slot {
  SLOT_UNSPECIFIED = 0;
  SLOT_HAT = 1;
  SLOT_BEARD = 2;
  SLOT_FACE = 3; // glasses, masks, pipes
  SLOT_BODY = 4;
  SLOT_FEET = 5;
  SLOT_BACK = 6; // backpacks, capes, wings
  // Hand slots. An item with ITEM_HANDLING_TWO_HANDED sits in SLOT_MAIN_HAND and leaves
  // SLOT_OFF_HAND empty; SetLoadout rejects a loadout that has both.
  SLOT_MAIN_HAND = 7;
  SLOT_OFF_HAND = 8;
  SLOT_BALL = 9; // the ball a game puts in play (golf ball, bowling ball)
  SLOT_RIDE = 10; // whatever the gnome drives or stands on (mower, raft, car)
  SLOT_TRAIL = 11; // particle trail
  SLOT_EMOTE = 12;
}

// Trait enums. Rules for all of them:
//   - Add a value when a game needs to ask a question no existing combination answers. A new
//     group of traits gets its own enum (and a field on ItemDef and a case in Trait), not a value
//     squeezed into an existing one.
//   - Prefer uses and handling in game code ("anything MELEE and ONE_HANDED") over family ("any
//     GOLF_CLUB"). Family is for explicit lookups and collections.
//   - Never renumber or reuse a value; retire one by leaving it unused.
// proto3 keeps enum values it does not know, so an old game ignores a new value instead of breaking.

// What the item broadly is.
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_HEADWEAR = 1;
  ITEM_KIND_FACIAL_HAIR = 2;
  ITEM_KIND_CLOTHING = 3;
  ITEM_KIND_FOOTWEAR = 4;
  ITEM_KIND_ACCESSORY = 5;
  ITEM_KIND_WEAPON = 6;
  ITEM_KIND_TOOL = 7;
  ITEM_KIND_SPORTS_GEAR = 8;
  ITEM_KIND_BALL = 9;
  ITEM_KIND_VEHICLE = 10;
  ITEM_KIND_PET = 11;
  ITEM_KIND_EFFECT = 12;
  ITEM_KIND_EMOTE = 13;
}

// A specific kind of object.
enum ItemFamily {
  ITEM_FAMILY_UNSPECIFIED = 0;
  ITEM_FAMILY_GOLF_BALL = 1;
  ITEM_FAMILY_GOLF_CLUB = 2;
  ITEM_FAMILY_BOWLING_BALL = 3;
  ITEM_FAMILY_BOWLING_PIN = 4;
  ITEM_FAMILY_LAWN_MOWER = 5;
  ITEM_FAMILY_RAFT = 6;
  ITEM_FAMILY_OAR = 7;
  ITEM_FAMILY_DISC = 8;
  ITEM_FAMILY_SLINGSHOT = 9;
  ITEM_FAMILY_SPRINKLER = 10;
  ITEM_FAMILY_TROWEL = 11;
  ITEM_FAMILY_CAR = 12;
}

// Which kind of game mechanic the item can skin.
enum ItemUse {
  ITEM_USE_UNSPECIFIED = 0;
  ITEM_USE_MELEE = 1; // can be swung or jabbed at something
  ITEM_USE_RANGED = 2; // fires something (slingshot, sprinkler)
  ITEM_USE_THROWABLE = 3; // can itself be thrown
  ITEM_USE_SWINGABLE = 4; // a swing that hits a ball (club, bat)
  ITEM_USE_ROLLABLE = 5; // can be bowled or rolled
  ITEM_USE_RIDEABLE = 6;
  ITEM_USE_SHIELD = 7;
  ITEM_USE_PROJECTILE = 8; // the thing that gets fired or hit (golf ball, pebble)
  ITEM_USE_ROWABLE = 9; // can paddle a raft
}

// Physical traits.
enum ItemHandling {
  ITEM_HANDLING_UNSPECIFIED = 0;
  ITEM_HANDLING_ONE_HANDED = 1;
  ITEM_HANDLING_TWO_HANDED = 2;
  ITEM_HANDLING_BLUNT = 3;
  ITEM_HANDLING_SHARP = 4;
  ITEM_HANDLING_HEAVY = 5;
  ITEM_HANDLING_LIGHT = 6;
  ITEM_HANDLING_LONG = 7; // long reach or long shape
  ITEM_HANDLING_BOUNCY = 8;
  ITEM_HANDLING_FLOATS = 9;
  ITEM_HANDLING_ROUND = 10;
  ITEM_HANDLING_MOTORIZED = 11;
}

// Sets and collections, and themed random picks.
enum ItemTheme {
  ITEM_THEME_UNSPECIFIED = 0;
  ITEM_THEME_GARDEN = 1;
  ITEM_THEME_SPORT = 2;
  ITEM_THEME_NAUTICAL = 3;
  ITEM_THEME_MILITARY = 4;
  ITEM_THEME_HOLIDAY = 5;
  ITEM_THEME_RETRO = 6;
  ITEM_THEME_SPOOKY = 7;
}

enum Rarity {
  RARITY_UNSPECIFIED = 0;
  RARITY_COMMON = 1;
  RARITY_UNCOMMON = 2;
  RARITY_RARE = 3;
  RARITY_LEGENDARY = 4;
}

enum ClaimPolicy {
  CLAIM_POLICY_UNSPECIFIED = 0;
  // Every new gnome has it. Never stored per user; implied.
  CLAIM_POLICY_STARTER = 1;
  // A game client may claim it after earning it in play (InventoryService.ClaimUnlock). Cheatable,
  // which is acceptable for cosmetics; see docs/design/gnome-platform.md.
  CLAIM_POLICY_CLIENT_CLAIM = 2;
  // Only a service or admin can grant it (events, promo codes, future purchases).
  CLAIM_POLICY_SERVER_GRANT = 3;
}

// One trait of any type, so a single query can mix them. An item has a trait when the matching
// ItemDef field equals it (kind, family) or contains it (uses, handling, themes).
message Trait {
  oneof trait {
    ItemKind kind = 1;
    ItemFamily family = 2;
    ItemUse use = 3;
    ItemHandling handling = 4;
    ItemTheme theme = 5;
  }
}

// A trait filter. An item matches when it has every `all_of` trait, at least one `any_of` trait
// (if any are given), no `none_of` trait, and the slot (if set).
//
// Examples:
//   Gnome Front random melee for a player holding a shield:
//     { slot: SLOT_MAIN_HAND, all_of: [{use: MELEE}], none_of: [{handling: TWO_HANDED}] }
//   Gnome Golf, the player's ball:
//     { slot: SLOT_BALL, all_of: [{family: GOLF_BALL}] }
//   Gnome Bowling, anything fun to bowl:
//     { slot: SLOT_BALL, all_of: [{use: ROLLABLE}, {handling: ROUND}] }
message TraitQuery {
  repeated Trait all_of = 1;
  repeated Trait any_of = 2;
  repeated Trait none_of = 3;
  Slot slot = 4;
}
